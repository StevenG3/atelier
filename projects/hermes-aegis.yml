# projects/hermes-aegis.yml
#
# Hermes × TradingAgents × Aegis 综合交易系统
#
# 目标：以自然语言作为输入输出，集市场分析、买点提示、自动下单、
#       美港股 / 币圈自动交易等功能于一体的大型综合工具。
#
# 架构：
#   用户 NL → 官方 Hermes → aegis-gateway skill
#           → Aegis（risk-engine / orchestrator / execution）
#           → TradingAgents（market analysis / signals）
#           → 交易所 / IBKR（执行）

name: "Hermes × TradingAgents × Aegis"
github_org_or_user: "StevenG3"

repos:
  - id: aegis
    github: "StevenG3/aegis"
    local_path: "/home/gggqqy/apps/aegis"
    role: "核心交易后端 — risk-engine / orchestrator / execution-service / ibkr-bridge / market-data / analysis-adapter"

  - id: hermes-agent
    github: "StevenG3/hermes-agent"
    local_path: "/home/gggqqy/apps/hermes-agent"
    role: "官方 Hermes NL 接口 + aegis-gateway skill（用户自然语言↔交易系统的 NL 桥梁）"

  - id: tradingagents
    github: "StevenG3/tradingagents-official"
    local_path: "/home/gggqqy/apps/tradingagents-official"
    role: "官方 TradingAgents — 市场分析 / 买卖信号 / 研究报告生成"

# Phase N Prompt 文件存放目录（已有 Phase 1–23）
# Claude 生成的规格保存至此，同时作为 Atelier Issue body
phases_prompt_dir: "/home/gggqqy/docs"
phases_prompt_pattern: "CODEX_PHASE{n}_PROMPT.md"
current_phase: 23

# 在 GitHub Project 看板「工程」字段的值，用于筛选
project_tag: "hermes-aegis"

# 验证命令（aegis 主仓，在 /home/gggqqy/apps/aegis 下运行）
build_command: "docker compose -f deploy/docker-compose.yml build"
test_command: "make test"
lint_command: "make verify"

# ── 自主开发循环：终极目标（North Star）─────────────────────────────
# Claude 规划下一个 Phase 时读此目标 + git 进度，自主决定下一步。
north_star: |
  以自然语言为输入输出，做一个集市场分析、买点提示、自动下单、
  美港股 / 币圈自动交易于一体的大型综合交易系统。
  用户在 Telegram/Feishu 用自然语言下达意图 → Hermes 解析 →
  TradingAgents 出分析与买卖信号 → Aegis 风控/编排/执行 →
  交易所(Binance)/IBKR 下单(paper 与 live)。
  每个 Phase 在前一 Phase 基础上增量推进，始终 fail-closed：
  live 交易、动钱、改 schema 等高危能力默认关闭，需显式逐层解锁。

# ── 自主循环护栏（orchestrator daemon 读取）────────────────────────
autonomy:
  enabled: true
  auto_merge: true            # Claude approve 即自动合并(用户选定)
  auto_codex_go: true         # 规划出 Phase 后自动打 codex:go(用户选定)
  max_phases_per_day: 10      # 每日自动 Phase 上限(熔断)
  max_consecutive_failures: 2 # 连续失败上限,超过暂停整个循环
  max_ci_fixes_per_pr: 3      # 单个 PR 的 CI 自动修复次数上限,超过 Claude ESCALATE
  max_review_iterations: 3    # 单个 PR 的 request-changes 自动修改次数上限
  kill_switch_file: ".atelier-stop"   # 此文件存在 → 立即暂停全循环

  # 重点审查清单:作为「给 Claude 评审时的高危提示」注入,命中这些的改动
  # Claude 会格外谨慎。决定权完全在 Claude——它可 APPROVE / CHANGES /
  # ESCALATE(主动求助人类)。不再用死关键词替 Claude 强制人类合并。
  review_focus:
    - "alter table"           # schema 迁移
    - "migration"
    - "DROP "
    - "billing"               # 计费 / 钱
    - "LIVE_TRADING_ENABLED"  # live 交易开关
    - "IBKR_LIVE_TRADING_ENABLED"
    - "IBKR_ALLOW_LIVE_PORT"
    - "secret"                # 密钥
    - "api_key"
    - "deploy/docker-compose" # 生产配置
    - ".env"
