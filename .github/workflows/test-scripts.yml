name: 脚本单元测试

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'

jobs:
  bats:
    name: bats 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 bats
        run: sudo apt-get install -y bats

      - name: 运行全部测试
        run: bats tests/ --formatter tap
