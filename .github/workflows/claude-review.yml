# Claude 评审 workflow（骨架，需你填凭据后启用）
#
# 触发：PR 打开/更新，或评论里 @claude 时，让 Claude 评审。
#
# ⚠️ 预算注意：在 Action 里跑 Claude 通常走 Anthropic API key（按 token 计费），
#    与你的 $20 Pro 订阅是分开计费的。如果想守住 $20 预算，建议先别开自动评审，
#    而是你手动在 Claude Code 会话里挑重要 PR 评审。确认当前订阅/API 行为见：
#    https://docs.claude.com/en/docs/claude-code/overview
#
# 启用步骤：
#  1) 在仓库 Settings → Secrets 添加 ANTHROPIC_API_KEY
#  2) 取消下面的注释，并按官方 action 文档核对版本：
#     https://github.com/anthropics/claude-code-action

name: claude-review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request' || contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ---- API key 模式（日后切换时取消注释）----
      # - name: Claude review / response
      #   uses: anthropics/claude-code-action@v1   # 用前请核对最新版本
      #   with:
      #     anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      #     system_prompt_suffix: |
      #       你是 CLAUDE.md 定义的架构师。
      #       回复 Codex 提问时使用以下格式（见 docs/interaction-protocol.md）：
      #       **决策：** [一个清晰答案]
      #       **理由：** [一句话]
      #       **行动：** 继续 | 等人类 | 停止
      #       评审 PR 时按 CLAUDE.md 评审清单输出 Approve 或 Request changes。
      # ---- OAuth 模式（当前）----
      - name: Log pending Claude task (OAuth mode)
        run: |
          echo "======================================================"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "检测到 PR #${{ github.event.pull_request.number }} 需要 Claude 评审。"
            echo "请用以下模板触发 Claude Code："
            echo "  prompts/claude-review.md.example  PR_NUMBER=${{ github.event.pull_request.number }}"
          else
            echo "检测到 @claude 提问（Issue/PR 评论）。"
            echo "请用以下模板触发 Claude Code："
            echo "  prompts/claude-respond.md.example  ISSUE_NUMBER=${{ github.event.issue.number }}"
          fi
          echo "或运行 scripts/check-pending.sh 查看所有待处理任务。"
          echo "======================================================"

