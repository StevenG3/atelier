# 事件驱动的自主开发循环触发器(self-hosted runner)
#
# 拉起方式:打 codex:go 标签 → GitHub 瞬间触发本 workflow → 你机器上的
# self-hosted runner 跑 orchestrator 一个 tick。无需常驻 daemon。
#
# 安全(public repo + self-hosted runner):
#   - 仅 issues labeled(打标签需仓库写权限,外部 fork 无法触发)
#     + schedule(内部定时)+ workflow_dispatch(手动)触发
#   - 绝不用 pull_request 触发(避免 fork PR 在本机跑任意代码)
#   - 若要更彻底的隔离,可将 repo 设为 private
#
# 注册 runner:见 docs/SELF_HOSTED_RUNNER.md

name: orchestrator

on:
  issues:
    types: [labeled]          # 打 codex:go → 即时拉起
  workflow_dispatch: {}        # 手动触发一个 tick
  schedule:
    - cron: "*/10 * * * *"     # 兜底:每10分钟推进 CI修复/评审/合并/规划

# 同一时刻只跑一个 tick(orchestrator 内部也有 flock 双保险)
concurrency:
  group: orchestrator-hermes-aegis
  cancel-in-progress: false

jobs:
  tick:
    # issue 事件只在 codex:go 标签时跑;schedule/手动总是跑
    if: >
      github.event_name != 'issues' ||
      github.event.label.name == 'codex:go'
    runs-on: self-hosted
    steps:
      - name: orchestrator tick
        env:
          HOME: /home/gggqqy
        run: |
          export PATH="/home/gggqqy/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
          cd /home/gggqqy/archives/atelier
          bash scripts/orchestrator.sh hermes-aegis
